<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Snowfall 0.1 — harness</title>
<link rel="stylesheet" href="harness.css">
</head>
<body>

<form id="gen" autocomplete="off" onsubmit="return false">
	<fieldset>
		<legend>generator</legend>
		<label class="rowf">preset
			<select id="preset">
				<option>mixed</option><option>mono</option><option>tight</option><option>draft</option>
			</select>
		</label>
		<label>chapters <output id="nO">6</output>
			<input id="n" type="range" min="1" max="12" step="1" value="6">
		</label>
		<label class="rowf">length
			<select id="len"><option>tiny</option><option selected>mono</option><option>huge</option></select>
		</label>
		<label class="rowf">text gap
			<select id="gap"><option value="zero">zero</option><option value="same">same</option><option value="mixed" selected>mixed</option><option value="huge">huge</option></select>
		</label>
		<label class="rowf">flow
			<select id="flow"><option>overlay</option><option>screen</option><option selected>mixed</option></select>
		</label>
	</fieldset>
	<fieldset>
		<legend>wagons</legend>
		<label class="rowf">mode
			<select id="mode"><option selected>mixed</option><option>cover</option><option>tiled</option><option>contain</option><option>fixed</option><option>auto</option></select>
		</label>
		<label class="rowf">size
			<select id="size"><option selected>mixed</option><option>256</option><option>512</option><option>1024</option></select>
		</label>
		<label class="rowf">data-dir
			<select id="dir">
				<option value="none" selected>none (top)</option><option value="mixed">mixed</option>
				<option value="top">top</option><option value="left">left</option>
				<option value="right">right</option><option value="bottom">bottom</option>
			</select>
		</label>
		<label class="rowf">nesting
			<select id="nest"><option selected>both</option><option>section</option><option>flat</option></select>
		</label>
		<label class="rowf">sticks
			<select id="stick"><option>off</option><option>top</option><option>bottom</option><option selected>both</option></select>
		</label>
		<label class="rowf"><input id="style" type="checkbox" checked> data-bg/fg/style</label>
		<label class="rowf"><input id="events" type="checkbox" checked> script events</label>
	</fieldset>
	<fieldset>
		<legend>examples · paste images</legend>
		<label for="exampleImages">image URLs, one per line</label>
		<textarea id="exampleImages" rows="5" spellcheck="false" placeholder="https://example.test/scene-1.jpg&#10;https://example.test/scene-2.jpg"></textarea>
		<label class="rowf"><input id="exampleGradient" type="checkbox" checked> include gradient</label>
		<textarea id="exampleOut" rows="8" readonly spellcheck="false" aria-label="Generated example HTML"></textarea>
		<output id="exampleStatus" aria-live="polite"></output>
		<small class="hint">The preview rebuilds with regen (r). Each background gets text stubs before and after it. Use the QA copy button for the whole container.</small>
	</fieldset>
	<fieldset>
		<legend>qa</legend>
		<label class="rowf">chapter <input id="jump" type="number" value="1" min="1" max="12" style="width:52px"></label>
		<label class="rowf">speed <output id="spd">6</output>
			<input id="speed" type="range" min="1" max="60" step="1" value="6">
		</label>
		<label class="rowf"><input id="wire" type="checkbox"> wireframes (w)</label>
		<label class="rowf"><input id="estate" type="checkbox"> engine state</label>
		<div class="btns">
			<button id="reg" type="button">regen (r)</button>
			<button id="seed" type="button">new seed</button>
			<button id="top" type="button">top (t)</button>
			<button id="bot" type="button">bottom (b)</button>
			<button id="prev" type="button">◂</button>
			<button id="next" type="button">▸</button>
			<button id="auto" type="button" data-on="0">autoscroll (space)</button>
			<button id="qaBtn" type="button">QA all (q)</button>
			<button id="exampleCopy" type="button" disabled>copy example outerHTML</button>
		</div>
	</fieldset>
</form>

<div id="diag">
	<pre id="dstats">…</pre>
	<div id="qa"></div>
	<pre id="estatePre"></pre>
</div>

<div id="app"></div>
<div id="rail" aria-hidden="true"></div>
<div id="mark" aria-hidden="true">0</div>
<div id="wires" aria-hidden="true"></div>

<script src="snowfall.js"></script>
<script src="harness.js"></script>
</body>
</html>
